name: T02 engineering baseline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: |
          set -eu
          mkdir -p .tools/t02
          curl --fail --location --retry 3 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz' -o .tools/t02/jdk.tar.gz
          echo 'ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94  .tools/t02/jdk.tar.gz' | sha256sum --check
          tar -xzf .tools/t02/jdk.tar.gz -C .tools/t02
          echo "JAVA_HOME=$GITHUB_WORKSPACE/.tools/t02/jdk-21.0.12.1+1" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.tools/t02/jdk-21.0.12.1+1/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip -o .tools/t02/maven.zip
          echo '03e2d65d4483a3396980629f260e25cac0d8b6f7f2791e4dc20bc83f9514db8d0f05b0479e699a5f34679250c49c8e52e961262ded468a20de0be254d8207076  .tools/t02/maven.zip' | sha512sum --check
          unzip -q .tools/t02/maven.zip -d .tools/t02
          chmod +x .tools/t02/apache-maven-3.9.11/bin/mvn
          npm install --global npm@11.12.1
          python -m pip install -r tests/contracts/T00/requirements.txt
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o .tools/t02/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .tools/t02/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .tools/t02/gitleaks.tar.gz -C .tools/t02
      - name: Locate the pinned gitleaks binary
        run: |
          set -eu
          # Callers must never hardcode one OS's file shape: the tarball drops a single-file binary on Linux,
          # while a local Windows tree keeps it in a directory as gitleaks.exe. Resolve once, reuse everywhere,
          # and fail loudly with a named error if the pinned tool is absent (silence here would cancel the scans).
          for candidate in .tools/t02/gitleaks .tools/t02/gitleaks/gitleaks .tools/t02/gitleaks/gitleaks.exe; do
            if [ -f "$candidate" ] && [ -x "$candidate" ]; then
              echo "GITLEAKS_BIN=$candidate" >> "$GITHUB_ENV"
              echo "resolved gitleaks binary: $candidate"
              exit 0
            fi
          done
          echo '::error::pinned gitleaks binary not found under .tools/t02/gitleaks; the secret scans would be cancelled' >&2
          exit 1
      - name: Approved contract, schema and cross-language vectors
        run: |
          python tests/engineering/T02/check_contracts.py
          python -m unittest discover -s tests/contracts/T00 -v
          node tests/contracts/T00/hash-vector-js.cjs
          python tests/engineering/T02/check_contracts.py
          git diff --exit-code -- docs tests/fixtures tests/contracts
      - name: Session cookie contract agreement gate
        run: python tests/engineering/T03/check_session_cookie.py
      - name: Backend build, policy tests and dependency inventory
        run: .tools/t02/apache-maven-3.9.11/bin/mvn -B -ntp -f backend/pom.xml verify
      - name: Frontend locked install, types and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Secret and dependency scans (fail on findings or unavailable service)
        run: |
          set -eu
          # Exemptions must be value-shaped: a gitleaks allowlist with a paths clause leaves the whole file
          # unscanned, so the allowlist itself and its suppression behaviour are policed here, not just the tree.
          python tests/engineering/T02/secret_scan.py --self-test
          python tests/engineering/T02/check_gitleaks_allowlists.py
          python tests/engineering/T02/secret_scan.py
          python tests/engineering/T02/scan_secrets.py --gitleaks "${GITLEAKS_BIN:?gitleaks binary unresolved}"
          python tests/engineering/T02/dependency_scan.py
          npm --prefix frontend audit
      - name: Gitleaks suppression controls (canary must be caught, benign manifest must stay clean)
        run: |
          set -eu
          # Separate step on purpose: earlier these controls sat before the real scans in one bash -e block, so a
          # broken control path cancelled secret_scan, scan_secrets, dependency_scan and npm audit together.
          test -x "${GITLEAKS_BIN:?gitleaks binary unresolved}"
          python tests/engineering/T02/check_gitleaks_allowlists.py --with-controls --gitleaks "${GITLEAKS_BIN}"
      - name: Actual Docker topology cold start and repeat migration
        run: |
          python tests/engineering/T02/record.py --name ci-compose-real -- python tests/engineering/T02/compose_smoke.py
          python tests/engineering/T02/record.py --name ci-entrypoint-real -- python tests/engineering/T02/compose_smoke.py --entrypoint
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: t02-build-evidence
          path: |
            backend/target/surefire-reports
            backend/target/sbom
            frontend/dist
            tests/engineering/T02/evidence/ci-*.json
