server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /actuator/info { proxy_pass http://backend:8080; }
    location = /actuator/health { proxy_pass http://backend:8080; }
    location = /actuator/health/readiness { proxy_pass http://backend:8080; }
    location /actuator/ { return 404; }
    location /api/ { proxy_pass http://backend:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
